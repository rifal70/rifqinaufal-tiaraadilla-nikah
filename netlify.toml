[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "B2_ENDPOINT,B2_REGION,ADMIN_EMAILS"

# Netlify auto-installs @netlify/plugin-nextjs (OpenNext adapter) for Next.js sites.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"